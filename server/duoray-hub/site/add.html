<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<meta name="referrer" content="no-referrer">
<title>Добавить подписку в DUORAY</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<style>
:root { --bg: #141118; --bg-2: #1c1822; --line: #ffffff24; --text: #f6eef3; --muted: #b9abb4;
  --grad: linear-gradient(100deg, #fdebf3 0%, #f4c2d7 45%, #c97fa3 100%); }
* { box-sizing: border-box; margin: 0; }
html { background: var(--bg); color: var(--text); }
body { font: 400 17px/1.6 system-ui, -apple-system, "Segoe UI", sans-serif; min-height: 100vh;
  display: grid; place-items: center; padding: 24px;
  background: radial-gradient(700px 480px at 70% 30%, #f4c2d71f, transparent 60%), var(--bg); }
main { width: 100%; max-width: 480px; text-align: center; }
svg { width: 84px; height: auto; }
h1 { margin-top: 22px; font-size: 26px; line-height: 1.25; }
p { margin-top: 12px; color: var(--muted); }
.actions { margin-top: 28px; display: grid; gap: 12px; }
a.btn, button { display: block; width: 100%; padding: 16px 20px; border-radius: 14px; font: 600 17px system-ui, sans-serif;
  text-decoration: none; cursor: pointer; border: 1px solid var(--line); background: #ffffff0d; color: var(--text); }
a.main { background: var(--grad); color: #2a1220; border: 0; }
a.btn:focus-visible, button:focus-visible { outline: 2px solid #f4c2d7; outline-offset: 3px; }
.hint { margin-top: 18px; font-size: 14px; }
.error h1 { color: #f4a3a3; }
</style>
</head>
<body>
<main id="main">
  <svg viewBox="-4 -4 206 169" aria-hidden="true"><defs><linearGradient id="g" gradientUnits="userSpaceOnUse" x1="0" y1="161" x2="198" y2="0"><stop offset="0" stop-color="#c97fa3"/><stop offset=".5" stop-color="#f4c2d7"/><stop offset="1" stop-color="#fdebf3"/></linearGradient></defs><path fill-rule="evenodd" fill="url(#g)" d="M0 0H47.5A80.5 80.5 0 0 1 47.5 161H0ZM17.71 17.71H47.5A62.79 62.79 0 0 1 47.5 143.29H17.71Z"/><path fill-rule="evenodd" fill="url(#g)" opacity=".5" d="M198 0H150.5A80.5 80.5 0 0 0 150.5 161H198ZM180.29 17.71H150.5A62.79 62.79 0 0 0 150.5 143.29H180.29Z"/></svg>
  <h1 id="title">Добавить подписку в DUORAY</h1>
  <p id="text">Сейчас откроется DUORAY с вашей подпиской. Подтвердите добавление в приложении.</p>
  <div class="actions" id="actions">
    <a class="btn main" id="open" href="#">Открыть в DUORAY</a>
    <a class="btn" href="/">Скачать DUORAY</a>
    <button type="button" id="copy" hidden>Скопировать ссылку на подписку</button>
  </div>
  <p class="hint">Если ничего не произошло, установите DUORAY и нажмите «Открыть» ещё раз.</p>
</main>
<script>
(function () {
  var raw = new URLSearchParams(location.search).get("url") || "";
  var ok = /^https?:\/\/[^\s]+$/i.test(raw);
  if (!ok) {
    document.getElementById("main").classList.add("error");
    document.getElementById("title").textContent = "Нет ссылки на подписку";
    document.getElementById("text").textContent = "Откройте эту страницу кнопкой из бота или скопируйте ссылку на подписку и добавьте её в DUORAY вручную.";
    document.getElementById("open").remove();
    return;
  }
  var link = "duoray://add/" + encodeURIComponent(raw);
  var open = document.getElementById("open");
  open.href = link;
  location.href = link;
  var copy = document.getElementById("copy");
  if (navigator.clipboard) {
    copy.hidden = false;
    copy.addEventListener("click", function () {
      navigator.clipboard.writeText(raw).then(function () { copy.textContent = "Скопировано"; });
    });
  }
})();
</script>
</body>
</html>
