[package]
name = "duoray-helper"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "DUORAY privileged helper that brings the TUN up for the GUI"

[dependencies]
anyhow = "1.0.104"
duoray-core = { version = "0.1.0", path = "../duoray-core" }
duotun = { version = "0.1.0", path = "../../../Duotun" }
serde_json = "1.0.151"
tokio = { version = "1.53.1", features = ["full"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }

[target."cfg(windows)".dependencies]
windows-service = "0.8.1"
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_Security", "Win32_Security_Authorization"] }
