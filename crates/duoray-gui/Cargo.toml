[package]
name = "duoray-gui"
version = "0.3.4"
edition = "2024"
description = "DUORAY desktop VPN client (Slint GUI over xray-core)"
license = "GPL-3.0-only"

[[bin]]
name = "duoray"
path = "src/main.rs"

[dependencies]
anyhow = "1.0.104"
arboard = { version = "3.6.1", default-features = false }
chrono = { version = "0.4.45", default-features = false, features = ["clock"] }
directories = "6.0.0"
fastrand = "2.5.0"
ed25519-dalek = { version = "2", default-features = false, features = ["std"] }
duoray-core = { path = "../duoray-core" }
png = "0.18.1"
regex = "1.13.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.10"
slint = { version = "1.18.1", features = ["unstable-winit-030"] }
socket2 = { version = "0.6.5", features = ["all"] }
ureq = { version = "3.4.2", features = ["socks-proxy", "json"] }
url = "2.5.8"

[build-dependencies]
slint-build = "1.18.1"

[target."cfg(unix)".dependencies]
libc = "0.2.189"

[target."cfg(target_os = \"linux\")".dependencies]
ksni = { version = "0.3.6", default-features = false, features = ["async-io", "blocking"] }

[target."cfg(any(windows, target_os = \"macos\"))".dependencies]
tray-icon = { version = "0.26.1", default-features = false }

[target."cfg(windows)".dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_NetworkManagement_IpHelper", "Win32_NetworkManagement_Ndis", "Win32_Networking_WinSock", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging"] }
